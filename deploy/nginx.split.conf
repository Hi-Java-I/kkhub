# 前后端分开部署示例：Nginx 托管 web/ 静态文件，/api 反向代理到 Node 后端
# 后端启动：SERVE_WEB=0 TRUST_PROXY=1 KK_SECRET=... node server.js（只监听本机端口）
server {
    listen 80;
    server_name kkaihub.northsea.site;

    root /srv/kk-ai-hub-bi/web;        # 把仓库里的 web/ 目录同步到这里
    index index.html;

    location = /admin  { try_files /admin.html =404; }
    location = /guide  { try_files /guide.html =404; }
    location ~* \.(html|js|css)$ { add_header Cache-Control "no-store"; }
    location /assets/  { expires 1d; }

    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
    }
    location = /healthz { proxy_pass http://127.0.0.1:5002; }
}
